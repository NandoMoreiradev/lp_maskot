services:
  - type: web
    name: maskot-lp-whatsapp
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: VITE_WHATSAPP_NUMBER
        sync: false
      - key: VITE_GA_MEASUREMENT_ID
        sync: false
      - key: VITE_GOOGLE_ADS_ID
        sync: false
      - key: VITE_GOOGLE_ADS_CONVERSION_LABEL
        sync: false
      - key: VITE_META_PIXEL_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
